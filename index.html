<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Reflexivo — Jornada de Odisseu</title>
  <!-- Google Fonts: Fredoka (títulos arredondados) & Nunito (corpo e perguntas) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Definindo SVGs reutilizáveis (Navio de Odisseu, Rosa dos Ventos, Ondas, Raios, Ramo de Louro) -->
  <svg width="0" height="0" style="position:absolute; width:0; height:0; overflow:hidden;" aria-hidden="true">
    <defs>
      <!-- NAVIO DE ODISSEU (Galera Grega Antiga + Sol Dourado ao fundo) -->
      <symbol id="svg-odysseus-ship" viewBox="0 0 280 210">
        <!-- Sol / Lua de fundo -->
        <circle cx="205" cy="118" r="38" fill="#F2DEC0" />
        <circle cx="72" cy="82" r="52" fill="#F5E5CC" opacity="0.6" />

        <!-- Mastro Central -->
        <rect x="128" y="26" width="5.5" height="145" rx="2.5" fill="#102D4F" />
        <!-- Verga Superior Curva -->
        <path d="M56 44 Q131 24 205 56" fill="none" stroke="#102D4F" stroke-width="5" stroke-linecap="round" />

        <!-- Cabos de sustentação (Rigging) -->
        <line x1="131" y1="30" x2="36" y2="145" stroke="#102D4F" stroke-width="2" />
        <line x1="131" y1="30" x2="232" y2="152" stroke="#102D4F" stroke-width="2" />
        <line x1="78" y1="115" x2="105" y2="168" stroke="#102D4F" stroke-width="2" />
        <line x1="184" y1="122" x2="162" y2="168" stroke="#102D4F" stroke-width="2" />

        <!-- Vela Principal Estufada ao Vento -->
        <path d="M58 45 Q131 27 203 57 C196 96 190 124 185 135 Q128 112 72 126 C62 98 57 68 58 45 Z" fill="#102D4F" />
        
        <!-- Listras Verticais da Vela -->
        <path d="M84 41 C79 72 80 100 86 123" fill="none" stroke="#FBF2E3" stroke-width="2.4" stroke-linecap="round" />
        <path d="M108 37 C104 70 105 98 110 120" fill="none" stroke="#FBF2E3" stroke-width="2.4" stroke-linecap="round" />
        <path d="M132 36 C130 69 131 98 134 120" fill="none" stroke="#FBF2E3" stroke-width="2.4" stroke-linecap="round" />
        <path d="M156 40 C156 72 155 101 156 124" fill="none" stroke="#FBF2E3" stroke-width="2.4" stroke-linecap="round" />
        <path d="M180 47 C180 78 178 106 175 130" fill="none" stroke="#FBF2E3" stroke-width="2.4" stroke-linecap="round" />

        <!-- Silhueta de Odisseu no Convés -->
        <circle cx="151" cy="143" r="7.5" fill="#102D4F" />
        <path d="M139 172 C140 156 146 151 153 151 C160 151 164 157 166 172 Z" fill="#102D4F" />
        <path d="M144 156 L132 142" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />

        <!-- Casco do Navio Grego -->
        <path d="M35 122 C22 122 18 136 28 145 C36 152 38 141 33 137 C29 134 32 128 38 130 C44 155 62 184 92 194 L182 194 C210 185 228 164 236 138 C240 126 247 128 244 136 C241 142 248 145 251 137 C255 125 245 114 233 121 C224 126 220 148 205 164 L64 164 C50 151 44 132 35 122 Z" fill="#102D4F" />

        <!-- Faixa Decorativa e Escotilhas no Casco -->
        <path d="M62 174 Q134 182 206 172" fill="none" stroke="#FBF2E3" stroke-width="3.2" stroke-linecap="round" />
        <path d="M72 183 Q134 190 196 181" fill="none" stroke="#FBF2E3" stroke-width="2.2" stroke-linecap="round" />
        <circle cx="88" cy="169" r="2.3" fill="#FBF2E3" />
        <circle cx="106" cy="170" r="2.3" fill="#FBF2E3" />
        <circle cx="124" cy="171" r="2.3" fill="#FBF2E3" />
        <circle cx="142" cy="171" r="2.3" fill="#FBF2E3" />
        <circle cx="160" cy="170" r="2.3" fill="#FBF2E3" />
        <circle cx="178" cy="169" r="2.3" fill="#FBF2E3" />

        <!-- Marola na base do casco -->
        <path d="M44 195 Q68 185 92 195 T140 195 T188 195 T228 192" fill="none" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
        <path d="M30 204 Q62 194 94 204 T158 204 T222 200" fill="none" stroke="#356088" stroke-width="3.5" stroke-linecap="round" />
      </symbol>

      <!-- ONDAS LOCALIZADAS NA CAPA (Canto inferior esquerdo sob o navio) -->
      <symbol id="svg-cover-waves" viewBox="0 0 560 95" preserveAspectRatio="none">
        <path d="M0 44 C55 24, 115 28, 175 52 C230 74, 290 36, 360 54 C415 68, 465 56, 535 76 L550 95 L0 95 Z" fill="#82A9CA" />
        <path d="M0 58 C65 36, 130 42, 195 66 C260 88, 320 50, 395 68 C445 80, 490 72, 545 88 L550 95 L0 95 Z" fill="#37628B" />
        <path d="M0 72 C70 54, 135 60, 205 80 C275 96, 340 66, 425 82 L495 95 L0 95 Z" fill="#113357" />
        <path d="M8 52 C68 32, 128 36, 190 60" fill="none" stroke="#FBF2E3" stroke-width="3.2" stroke-linecap="round" />
        <path d="M215 64 C275 44, 330 46, 395 66" fill="none" stroke="#FBF2E3" stroke-width="3" stroke-linecap="round" />
      </symbol>

      <!-- ROSA DOS VENTOS (Compass Rose) -->
      <symbol id="svg-compass-rose" viewBox="0 0 140 140">
        <circle cx="64" cy="74" r="49" fill="#F2DEC0" />
        <circle cx="70" cy="70" r="50" fill="none" stroke="#102D4F" stroke-width="2" />
        <circle cx="70" cy="70" r="44" fill="none" stroke="#102D4F" stroke-width="1" stroke-dasharray="3 3" />

        <!-- Pontas Diagonais -->
        <g>
          <polygon points="70,70 78,54 106,34 86,62" fill="#102D4F" />
          <polygon points="70,70 106,34 78,54" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" />
          <polygon points="70,70 86,78 106,106 78,86" fill="#102D4F" />
          <polygon points="70,70 106,106 86,78" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" />
          <polygon points="70,70 62,86 34,106 54,78" fill="#102D4F" />
          <polygon points="70,70 34,106 62,86" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" />
          <polygon points="70,70 54,62 34,34 62,54" fill="#102D4F" />
          <polygon points="70,70 34,34 54,62" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" />
        </g>

        <!-- Pontas Cardeais Principais -->
        <g>
          <polygon points="70,8 81,56 70,70" fill="#102D4F" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="70,8 59,56 70,70" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="70,132 59,84 70,70" fill="#102D4F" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="70,132 81,84 70,70" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="132,70 84,81 70,70" fill="#102D4F" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="132,70 84,59 70,70" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="8,70 56,59 70,70" fill="#102D4F" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
          <polygon points="8,70 56,81 70,70" fill="#FBF2E3" stroke="#102D4F" stroke-width="1.5" stroke-linejoin="round" />
        </g>
        <circle cx="70" cy="70" r="3.5" fill="#102D4F" />
      </symbol>

      <!-- ONDAS DO MAR EM CAMADAS (Rodapé dos cards 1 a 7) -->
      <symbol id="svg-ocean-waves" viewBox="0 0 900 110" preserveAspectRatio="none">
        <path d="M0 52 C85 18, 175 22, 265 56 C355 88, 450 20, 555 48 C650 74, 760 18, 900 46 L900 110 L0 110 Z" fill="#82A9CA" />
        <path d="M0 64 C110 26, 210 34, 315 72 C415 104, 515 32, 635 58 C735 80, 815 38, 900 58 L900 110 L0 110 Z" fill="#37628B" />
        <path d="M0 80 C95 48, 195 58, 295 88 C395 112, 495 54, 610 78 C715 100, 810 62, 900 76 L900 110 L0 110 Z" fill="#113357" />
        <path d="M-10 52 C85 18, 175 22, 265 56 C355 88, 450 20, 555 48 C650 74, 760 18, 910 46" fill="none" stroke="#FBF2E3" stroke-width="4" stroke-linecap="round" />
        <path d="M18 68 C105 38, 185 44, 275 76" fill="none" stroke="#FBF2E3" stroke-width="3" stroke-linecap="round" />
        <path d="M355 72 C445 36, 535 40, 625 68" fill="none" stroke="#FBF2E3" stroke-width="3" stroke-linecap="round" />
        <path d="M675 66 C755 34, 825 38, 905 62" fill="none" stroke="#FBF2E3" stroke-width="3" stroke-linecap="round" />
        <path d="M65 88 C140 66, 210 72, 285 96" fill="none" stroke="#82A9CA" stroke-width="2.5" stroke-linecap="round" />
        <path d="M415 92 C495 66, 565 70, 645 94" fill="none" stroke="#82A9CA" stroke-width="2.5" stroke-linecap="round" />
      </symbol>

      <!-- TRÊS TRAÇOS DECORATIVOS À DIREITA DAS PERGUNTAS -->
      <symbol id="svg-burst-small" viewBox="0 0 40 45">
        <line x1="6" y1="16" x2="22" y2="4" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
        <line x1="10" y1="26" x2="32" y2="21" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
        <line x1="8" y1="36" x2="28" y2="39" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
      </symbol>

      <!-- RAMO DE LOURO / OLIVEIRA -->
      <symbol id="svg-laurel-branch" viewBox="0 0 80 110">
        <path d="M16 98 Q38 62 56 14" fill="none" stroke="#102D4F" stroke-width="3.2" stroke-linecap="round" />
        <path d="M26 78 C16 70 16 56 28 62 C32 66 30 74 26 78 Z" fill="#102D4F" />
        <path d="M35 58 C24 49 25 35 37 42 C41 46 39 54 35 58 Z" fill="#102D4F" />
        <path d="M44 38 C34 29 36 16 47 23 C50 27 48 34 44 38 Z" fill="#102D4F" />
        <path d="M55 18 C52 5 64 2 64 14 C64 19 58 20 55 18 Z" fill="#102D4F" />
        <path d="M29 82 C42 82 48 70 36 67 C31 67 28 75 29 82 Z" fill="#102D4F" />
        <path d="M38 62 C52 61 57 49 45 47 C40 47 37 55 38 62 Z" fill="#102D4F" />
        <path d="M47 42 C60 40 65 28 53 27 C48 27 46 35 47 42 Z" fill="#102D4F" />
      </symbol>
    </defs>
  </svg>

  <div class="app-wrapper">
    <!-- Barra Superior Compacta: Apenas Pausar/Tocar e Volume -->
    <header class="music-topbar" aria-label="Controle de som">
      <div class="music-controls">
        <button type="button" class="btn-music-toggle" id="btn-music-toggle" aria-label="Tocar ou pausar">
          <span id="music-toggle-icon">⏸</span>
          <span id="music-toggle-text">Pausar</span>
        </button>

        <div class="volume-control-wrap">
          <button type="button" class="btn-mute" id="btn-mute" title="Silenciar / Ativar som" aria-label="Silenciar ou ativar som">
            <span id="volume-icon">🔊</span>
          </button>
          <input
            type="range"
            id="volume-slider"
            class="volume-slider"
            min="0"
            max="100"
            value="65"
            aria-label="Volume"
          />
          <span class="volume-percent" id="volume-percent">65%</span>
        </div>
      </div>
    </header>

    <!-- Áudio da Música solicitada + Som do Mar -->
    <audio id="bg-music" autoplay loop preload="auto">
      <source src="musica.webm" type="audio/webm" />
      <source src="musica.m4a" type="audio/mp4" />
    </audio>
    <audio id="sea-ambience" autoplay loop preload="auto"></audio>

    <!-- Palco Principal do Quiz -->
    <main class="quiz-stage">
      <div class="slides-container" id="slides-container">

        <!-- =================================================
             TELA 0: CAPA ("Quiz Reflexivo - Jornada de Odisseu")
             ================================================= -->
        <section class="slide-card active" data-slide="0" aria-label="Capa do Quiz">
          <div class="cover-content">
            <div class="title-badge-group">
              <!-- Traços e raios esquerdos -->
              <svg class="title-rays-left" width="65" height="90" viewBox="0 0 65 90" aria-hidden="true">
                <path d="M60 25 L10 5 C6 4 4 10 9 13 L56 32 Z" fill="#F2DEC0" />
                <path d="M58 46 L4 42 C0 42 0 49 5 50 L57 52 Z" fill="#F2DEC0" />
                <line x1="52" y1="30" x2="26" y2="18" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
                <line x1="48" y1="45" x2="20" y2="45" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
                <line x1="52" y1="60" x2="25" y2="70" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
              </svg>

              <h1 class="main-title-banner">Quiz Reflexivo</h1>
              <div class="subtitle-banner">Jornada de Odisseu</div>

              <!-- Traços e raios direitos -->
              <svg class="title-rays-right" width="65" height="90" viewBox="0 0 65 90" aria-hidden="true">
                <path d="M5 25 L55 5 C59 4 61 10 56 13 L9 32 Z" fill="#F2DEC0" />
                <path d="M7 46 L61 42 C65 42 65 49 60 50 L8 52 Z" fill="#F2DEC0" />
                <line x1="13" y1="30" x2="39" y2="18" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
                <line x1="17" y1="45" x2="45" y2="45" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
                <line x1="13" y1="60" x2="40" y2="70" stroke="#102D4F" stroke-width="4.5" stroke-linecap="round" />
              </svg>
            </div>

            <p class="cover-description">
              Responda com sinceridade e reflita<br />
              sobre o papel do RH nas mudanças!
            </p>
          </div>

          <!-- Cena Unificada da Capa: Barco à esquerda na onda + Tracejado passando por cima + Bússola à direita + Botão centralizado embaixo -->
          <div class="cover-scene">
            <svg class="cover-map-svg" viewBox="0 0 1000 280" fill="none" aria-hidden="true">
              <!-- Caminho tracejado saindo da proa do barco, passando por cima no meio e chegando na bússola à direita -->
              <path
                d="M 272 162 C 430 28, 640 24, 808 96"
                stroke="#102D4F"
                stroke-width="3.5"
                stroke-dasharray="10 10"
                stroke-linecap="round"
              />

              <!-- Bússola / Rosa dos Ventos à direita -->
              <use href="#svg-compass-rose" x="815" y="28" width="140" height="140" />

              <!-- Barco de Odisseu à esquerda sobre a onda -->
              <g class="svg-ship-anim">
                <use href="#svg-odysseus-ship" x="15" y="56" width="265" height="200" />
              </g>
            </svg>

            <!-- Botão Vamos começar? centralizado embaixo no meio -->
            <button type="button" class="btn-start-quiz" id="btn-start-quiz">
              <span>Vamos começar?</span>
              <span class="arrow-icon" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
          </div>

          <!-- Onda na tela toda no rodapé da tela inicial -->
          <div class="waves-footer">
            <svg><use href="#svg-ocean-waves"></use></svg>
          </div>
        </section>

        <!-- As 6 Telas de Perguntas são montadas aqui via script.js -->
        <div id="questions-mount"></div>

        <!-- =================================================
             TELA 7: MENSAGEM REFLEXIVA FINAL + ESCOLHAS DA PESSOA
             ("Sua jornada termina aqui!")
             ================================================= -->
        <section class="slide-card" data-slide="7" aria-label="Mensagem Reflexiva Final e Suas Escolhas">
          <div class="final-layout">
            <div class="final-banner-group">
              <!-- Raios e traços esquerdos -->
              <svg class="final-rays-left" width="85" height="75" viewBox="0 0 85 75" aria-hidden="true">
                <path d="M75 38 L10 12 C4 10 1 18 7 22 L70 46 Z" fill="#F2DEC0" />
                <path d="M72 52 L16 46 C10 45 9 53 15 55 L70 58 Z" fill="#F2DEC0" />
                <line x1="68" y1="36" x2="48" y2="20" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
                <line x1="62" y1="46" x2="38" y2="41" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
                <line x1="64" y1="56" x2="42" y2="60" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
              </svg>

              <h2 class="final-banner">Sua jornada termina aqui!</h2>

              <!-- Raios e traços direitos -->
              <svg class="final-rays-right" width="85" height="75" viewBox="0 0 85 75" aria-hidden="true">
                <path d="M10 38 L75 12 C81 10 84 18 78 22 L15 46 Z" fill="#F2DEC0" />
                <path d="M13 52 L69 46 C75 45 76 53 70 55 L15 58 Z" fill="#F2DEC0" />
                <line x1="17" y1="36" x2="37" y2="20" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
                <line x1="23" y1="46" x2="47" y2="41" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
                <line x1="21" y1="56" x2="43" y2="60" stroke="#102D4F" stroke-width="4" stroke-linecap="round" />
              </svg>
            </div>

            <!-- Rosa dos Ventos no canto superior direito -->
            <div class="final-compass-wrap">
              <svg width="100%" height="100%">
                <use href="#svg-compass-rose"></use>
              </svg>
            </div>

            <div class="final-main-body">
              <!-- Card azul claro central com a mensagem reflexiva -->
              <div class="final-message-card">
                <p class="final-message-text">
                  Uma mudança bem conduzida<br />
                  começa com compreensão, cresce<br />
                  com orientação e se fortalece com apoio.
                </p>
                <p class="final-message-highlight">
                  E o RH é o guia nessa jornada!
                </p>

                <!-- Ramo de oliveira/louro no canto inferior direito do card -->
                <div class="final-laurel-wrap">
                  <svg width="100%" height="100%">
                    <use href="#svg-laurel-branch"></use>
                  </svg>
                </div>
              </div>

              <!-- Suas Escolhas na Jornada -->
              <div class="final-choices-box">
                <h3 class="final-choices-title">Suas escolhas na jornada:</h3>
                <div class="final-choices-grid" id="final-choices-grid"></div>
              </div>

              <!-- Botão para recomeçar -->
              <div class="final-actions-bar">
                <button type="button" class="btn-nav btn-nav-primary" id="btn-restart-quiz">
                  <span>↻</span>
                  <span>Refazer a Jornada</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Navio de Odisseu ancorado diretamente sobre as ondas do rodapé -->
          <div class="final-ship-wrap">
            <svg width="100%" height="100%">
              <use href="#svg-odysseus-ship"></use>
            </svg>
          </div>

          <div class="waves-footer">
            <svg><use href="#svg-ocean-waves"></use></svg>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
